name: SHUSHU Telegram Bot

on:
  schedule:
    - cron: "0 6-21 * * *"   # filtered in code to 09:00-23:00 Israel time
  workflow_dispatch:

concurrency:
  group: shushu-tracker
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync tracker (latest state from GitHub)
        run: git pull origin main

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "-1004476884876"
          ARTICLE_EVERY_N_RUNS: "4"
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
        run: python bot.py || echo "Bot exited with error — tracker will still be committed"

      - name: Commit tracker update
        if: always()
        run: |
          git config user.name "SHUSHU Bot"
          git config user.email "bot@shushu-secret.com"
          git add posted_products.json
          git diff --cached --quiet || git commit -m "chore: tracker update [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 10
          done
