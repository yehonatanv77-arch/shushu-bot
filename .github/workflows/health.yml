name: Nightly health check

on:
  schedule:
    - cron: "15 20 * * *"   # 22:15 Israel time in winter, 23:15 in summer
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/health_check.py
