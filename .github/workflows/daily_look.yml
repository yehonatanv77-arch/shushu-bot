name: SHUSHU Daily Look

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 IL in summer
    - cron: "0 7 * * *"   # 09:00 IL in winter
  workflow_dispatch:

concurrency:
  group: shushu-tracker
  cancel-in-progress: false

jobs:
  daily-look:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync tracker (latest state from GitHub)
        run: git pull origin main

      - name: Post daily look
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "-1004476884876"
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
        run: python run_daily_look.py || echo "Daily look exited with error — tracker will still be committed"

      - name: Commit tracker update
        if: always()
        run: |
          git config user.name "SHUSHU Bot"
          git config user.email "bot@shushu-secret.com"
          git add posted_products.json
          git diff --cached --quiet || git commit -m "chore: daily look tracker [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 10
          done
