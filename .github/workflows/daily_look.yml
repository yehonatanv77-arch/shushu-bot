name: SHUSHU Daily Look

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  daily-look:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post daily look
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "-1004476884876"
        run: python run_daily_look.py

      - name: Commit tracker update
        run: |
          git config user.name "SHUSHU Bot"
          git config user.email "bot@shushu-secret.com"
          git add posted_products.json
          git diff --cached --quiet || git commit -m "chore: daily look tracker [skip ci]"
          git pull --rebase origin main
          git push
